<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Journey - Travel Journey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <h1>Travel Journey</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="logout.html">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="form-container">
            <h2>Create New Journey</h2>
            <div id="messages"></div>
            <form id="createForm">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label for="media">Upload Media (Images, Videos, GPX):</label>
                    <input type="file" id="media" name="media" multiple accept=".jpg,.jpeg,.png,.mp4,.gpx">
                    <div id="filePreview"></div>
                </div>
                <button type="submit" class="btn">Create Journey</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Travel Journey Sharing. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        // Check login
        if (!localStorage.getItem('loggedIn')) {
            window.location.href = 'login.html';
        }

        document.getElementById('createForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Simulate creation
            document.getElementById('messages').innerHTML = '<div class="success-message"><p>Journey created successfully!</p></div>';
            setTimeout(() => window.location.href = 'dashboard.html', 2000);
        });

        // File preview
        document.getElementById('media').addEventListener('change', function(e) {
            const preview = document.getElementById('filePreview');
            preview.innerHTML = '';
            Array.from(e.target.files).forEach(file => {
                const item = document.createElement('div');
                item.textContent = file.name;
                preview.appendChild(item);
            });
        });
    </script>
</body>
</html>
