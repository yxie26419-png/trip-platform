<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Travel Journey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <h1>Travel Journey</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="form-container">
            <h2>Login</h2>
            <div id="messages"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username_or_email">Username or Email:</label>
                    <input type="text" id="username_or_email" name="username_or_email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Travel Journey Sharing. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const usernameOrEmail = document.getElementById('username_or_email').value;
            const password = document.getElementById('password').value;

            // Simulate login check
            if ((usernameOrEmail === 'admin' || usernameOrEmail === 'admin@example.com') && password === 'password') {
                localStorage.setItem('loggedIn', 'true');
                localStorage.setItem('username', 'admin');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('messages').innerHTML = '<div class="error-messages"><p>Invalid username/email or password.</p></div>';
            }
        });
    </script>
</body>
</html>
